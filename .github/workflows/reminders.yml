name: Send Calendar Reminders

on:
  schedule:
    - cron: '*/30 * * * *'   # backup restart only; the loop below does the real work
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Run reminder loop
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LOOP_MINUTES: '345'
        run: node index.js
        working-directory: functions

      # GITHUB_TOKEN may trigger workflow_dispatch, so the loop restarts itself without waiting for cron
      - name: Restart loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reminders.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
